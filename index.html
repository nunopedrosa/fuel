<!doctype html>
<html lang="en" data-app-version="fuellog-v44-storage">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FuelLog" />
  <meta name="description" content="A private, local-first fuel log with Portuguese station prices." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="preload" href="fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css?v=fuellog-v44-storage" />
  <title>FuelLog</title>
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
  <div class="app-shell">
    <header class="topbar">
      <div class="top-left">
        <button class="brand" data-route="dashboard" data-i18n-aria-label="ui.fuellog_dashboard" aria-label="FuelLog dashboard">
          <img src="icons/icon.svg" alt="" />
          <span>FuelLog</span>
        </button>
        <span id="pageKicker" class="kicker"></span>
      </div>
      <div class="top-actions">
        <span id="offlineBadge" class="status-pill">Offline ready</span>
        <button data-i18n="ui.install" id="installBtn" class="btn ghost hidden">Install</button>
        <div class="language-picker">
          <button type="button" id="languageButton" class="header-icon" aria-label="Language: English" title="Language: English" aria-expanded="false" aria-controls="languageChoices"><span aria-hidden="true">🇬🇧</span></button>
          <div id="languageChoices" class="language-choices hidden" role="group" aria-label="Choose language"></div>
        </div>
        <a id="suggestBtn" class="fab hidden" href="mailto:nuno.f.pedrosa@gmail.com" data-i18n-aria-label="ui.email_a_suggestion" data-i18n-title="ui.suggest" aria-label="Email a suggestion" title="Suggest">✉</a>
      </div>
    </header>

    <main id="app" class="content startup-loading" aria-live="polite" aria-busy="true" aria-label="Loading dashboard">
      <div class="hero">
        <div class="hero-card">
          <div class="startup-bar startup-bar-title" aria-hidden="true"></div>
          <p class="startup-line muted" aria-hidden="true"></p>
          <div class="hero-metric">— <small>L/100 km average</small></div>
        </div>
        <div class="side-card">
          <div>
            <div class="kicker">Latest fill-up</div>
            <div class="startup-bar startup-bar-big" aria-hidden="true"></div>
            <p class="muted" aria-hidden="true">—</p>
          </div>
          <div class="actions-inline dashboard-fill-actions">
            <button class="btn" type="button" tabindex="-1" disabled>+ Add fill-up</button>
            <button type="button" class="btn secondary" tabindex="-1" disabled aria-hidden="true">📷 Scan</button>
            <button type="button" class="btn ghost" tabindex="-1" disabled aria-hidden="true">Photos</button>
          </div>
        </div>
      </div>
      <div class="grid">
        <div class="stat"><div class="label">Distance logged</div><div class="value">—</div></div>
        <div class="stat"><div class="label">Fuel logged</div><div class="value">—</div></div>
        <div class="stat"><div class="label">Total spend</div><div class="value">—</div></div>
        <div class="stat"><div class="label">Logged spending / km</div><div class="value">—</div></div>
      </div>
    </main>

    <nav class="bottom-nav" data-i18n-aria-label="ui.primary_navigation" aria-label="Primary navigation">
      <button data-route="dashboard" class="nav-item active"><span>⌂</span><small data-i18n="nav.home">Home</small></button>
      <button data-route="add" class="nav-item"><span>＋</span><small data-i18n="nav.fillup">Fill-up</small></button>
      <button data-route="history" class="nav-item"><span>≡</span><small data-i18n="nav.history">History</small></button>
      <button data-route="prices" class="nav-item"><span>€</span><small data-i18n="nav.prices">Prices</small></button>
      <button data-route="settings" class="nav-item"><span>⚙</span><small data-i18n="nav.settings">Settings</small></button>
    </nav>
  </div>
  <div id="modalRoot" class="modal-root hidden" aria-hidden="true">
    <div class="modal-backdrop" data-modal-cancel></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle" class="modal-title"></h2>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-actions form-actions">
        <button type="button" id="modalCancel" class="btn ghost">Cancel</button>
        <button type="button" id="modalConfirm" class="btn">OK</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script defer src="js/i18n/i18n.js?v=fuellog-v44-storage"></script>
  <script defer src="js/i18n/en.js?v=fuellog-v44-storage"></script>
  <script defer src="js/i18n/pt.js?v=fuellog-v44-storage"></script>
  <script defer src="js/ui-icons.js?v=fuellog-v44-storage"></script>
  <script defer src="config.js?v=fuellog-v44-storage"></script>
  <script defer src="db.js?v=fuellog-v44-storage"></script>
  <script defer src="js/prices/fuels.js?v=fuellog-v44-storage"></script>
  <script defer src="js/prices/providers.js?v=fuellog-v44-storage"></script>
  <script defer src="js/prices/promos.js?v=fuellog-v44-storage"></script>
  <script defer src="js/data.js?v=fuellog-v44-storage"></script>
  <script defer src="app.js?v=fuellog-v44-storage"></script>
</body>
</html>
