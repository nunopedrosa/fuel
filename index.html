<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FuelLog" />
  <meta name="description" content="A private, local-first fuel log with Portuguese station prices." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="preload" href="fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css?v=18" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <title>FuelLog</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="top-left">
        <button class="brand" data-route="dashboard" aria-label="FuelLog dashboard">
          <img src="icons/icon.svg" alt="" />
          <span>FuelLog</span>
        </button>
        <span id="pageKicker" class="kicker"></span>
      </div>
      <div class="top-actions">
        <span id="offlineBadge" class="status-pill">Offline ready</span>
        <button id="installBtn" class="btn ghost hidden">Install</button>
        <a id="suggestBtn" class="fab hidden" href="mailto:nuno.f.pedrosa@gmail.com" aria-label="Email a suggestion" title="Suggest">✉</a>
      </div>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-route="dashboard" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-route="add" class="nav-item"><span>＋</span><small>Fill-up</small></button>
      <button data-route="history" class="nav-item"><span>≡</span><small>History</small></button>
      <button data-route="prices" class="nav-item"><span>€</span><small>Prices</small></button>
      <button data-route="settings" class="nav-item"><span>⚙</span><small>Settings</small></button>
    </nav>
  </div>
  <div id="modalRoot" class="modal-root hidden" aria-hidden="true">
    <div class="modal-backdrop" data-modal-cancel></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle" class="modal-title"></h2>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-actions form-actions">
        <button type="button" id="modalCancel" class="btn ghost">Cancel</button>
        <button type="button" id="modalConfirm" class="btn">OK</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="js/prices/fuels.js"></script>
  <script src="js/prices/providers.js"></script>
  <script src="js/prices/promos.js"></script>
  <script src="js/prices/providers/pt-dgeg.js"></script>
  <script src="js/prices/providers/es-minetur.js"></script>
  <script src="js/prices/providers/fr-government.js"></script>
  <script src="js/prices/providers/be-fps.js"></script>
  <script src="js/prices/providers/nl-cbs.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
