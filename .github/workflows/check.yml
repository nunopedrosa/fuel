name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check db.js
          node --check config.js
          node --check sw.js
      - name: Validate manifest JSON
        run: python3 -m json.tool manifest.webmanifest >/dev/null
      - name: Ensure no PHP backend is shipped
        run: test -z "$(find . -type f -name '*.php' -print -quit)"
