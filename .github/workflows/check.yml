name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check db.js
          node --check config.js
          node --check sw.js
          for f in $(find js -name '*.js'); do node --check "$f"; done
      - name: No iOS 12-incompatible syntax
        run: '! grep -rnE "[A-Za-z_\]\)]\?\.[A-Za-z_\[]|\?\?|\.at\(|replaceAll|Object\.fromEntries" app.js db.js sw.js config.js js/'
      - name: Import and data checks
        run: |
          node scripts/check-bplist.js
          node scripts/check-data.js
          node scripts/check-jerrycan.js
          node scripts/check-import-transaction.js
          node scripts/check-import-flow.js
          node scripts/check-urban-profile.js
          node scripts/check-import-backup.js
          node scripts/check-analysis.js
          node scripts/check-analysis-ui.js
          node scripts/check-calc.js
          node scripts/check-migrate.js
          node scripts/check-providers.js
          node scripts/check-sw-assets.js
          node scripts/check-fuels.js
          node scripts/check-promos.js
          node scripts/check-receipt.js
      - name: Validate manifest JSON
        run: python3 -m json.tool manifest.webmanifest >/dev/null
      - name: Only the station proxy may be PHP
        run: test "$(find . -type f -name '*.php' -not -path './.git/*' | sort | tr '\n' ' ')" = "./api/stations.php "
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Lint PHP
        run: php -l api/stations.php
      - name: Station proxy checks
        run: php -l api/stations-functions.php && php scripts/check-stations.php
